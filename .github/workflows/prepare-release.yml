name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version to release (1.2.3), overriding the bump
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tag:
    name: Tag the release
    runs-on: ubuntu-24.04
    # The tag has to be pushed with a token of its own: a push made with GITHUB_TOKEN starts no further workflow, so
    # Release would never run.
    environment: release-auth
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true
      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          if [ -n "$EXPLICIT" ]; then
            next="${EXPLICIT#v}"
          else
            current=$(git tag --list 'v*' --sort=-v:refname | head -1)
            current="${current#v}"
            current="${current:-0.0.0}"
            IFS='.' read -r major minor patch <<< "$current"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next"
      - name: Push the tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "::error::v$NEXT already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEXT" -m "Release $NEXT"
          git push origin "v$NEXT"
      - name: Say what happens next
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          echo "Tagged v$NEXT. Release now builds the direct download, the cask and the App Store upload." \
            >> "$GITHUB_STEP_SUMMARY"

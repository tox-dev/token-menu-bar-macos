name: Settings OCR diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recognize:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Verify macOS 27 runtime
        id: runtime
        run: |
          version="$(sw_vers -productVersion)"
          [[ "${version%%.*}" == 27 ]] || { echo "::error::Unexpected macOS $version"; exit 1; }
          echo "Runtime: macOS $version" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode 27
        env:
          MIN_XCODE_MAJOR: 27
          EXACT_XCODE_MAJOR: 27
        run: Scripts/select-xcode.sh
      - name: Render and assert mock Settings
        env:
          TOKEN_MENU_BAR_RENDER_ARTIFACTS: ${{ runner.temp }}/settings-render
        run: |
          env -u TOKEN_MENU_BAR_TEST_DESKTOP swift test --jobs 2 --no-parallel \
            --filter 'settings(TemplateControlsAppearOnlyForCustomFormat|DemoNoticeMatchesTheActiveDataMode|SetupGuidanceMatchesProviderDiscovery)'
      - name: Compare recognition paths on the same PNG
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        env:
          TOKEN_MENU_BAR_RENDER_ARTIFACTS: ${{ runner.temp }}/settings-render
        run: |
          set -o pipefail
          swift - <<'SWIFT' | tee "$TOKEN_MENU_BAR_RENDER_ARTIFACTS/recognition.txt"
          import Foundation
          import ImageIO
          import Vision

          let directory = URL(fileURLWithPath: ProcessInfo.processInfo.environment["TOKEN_MENU_BAR_RENDER_ARTIFACTS"]!)
          let png = try Data(contentsOf: directory.appendingPathComponent("providers-false.png"))
          let image = CGImageSourceCreateImageAtIndex(CGImageSourceCreateWithData(png as CFData, nil)!, 0, nil)!
          recognize(image, name: "whole")
          for height in [512, 1024] {
            for offset in stride(from: 0, to: image.height, by: height - 128) {
              let rect = CGRect(
                x: 0, y: CGFloat(offset), width: CGFloat(image.width),
                height: CGFloat(min(height, image.height - offset)))
              recognize(image.cropping(to: rect)!, name: "\(height)-\(offset)")
            }
          }

          func recognize(_ image: CGImage, name: String) {
            autoreleasepool {
              do {
                let request = VNRecognizeTextRequest()
                request.revision = VNRecognizeTextRequestRevision3
                request.recognitionLevel = .fast
                request.recognitionLanguages = ["en-US"]
                request.usesLanguageCorrection = true
                for (stage, devices) in try request.supportedComputeStageDevices {
                  guard let cpu = devices.first(where: { if case .cpu = $0 { true } else { false } }) else {
                    throw ProbeError.noCPU
                  }
                  request.setComputeDevice(cpu, for: stage)
                }
                try VNImageRequestHandler(cgImage: image, options: [:]).perform([request])
                for observation in request.results ?? [] {
                  let candidates = observation.topCandidates(3)
                  if candidates.contains(where: { $0.string.contains("provider") }) {
                    print("region=\(name) candidates=\(candidates.map(\.string))")
                  }
                }
              } catch {
                print("region=\(name) error=\(String(reflecting: error))")
              }
            }
          }

          enum ProbeError: Error {
            case noCPU
          }
          SWIFT
      - name: Retain mock images and recognition results
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: settings-ocr-diagnostic
          path: ${{ runner.temp }}/settings-render
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

name: Focused UI verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.9.3
      - name: Select Xcode 16
        env:
          MIN_XCODE_MAJOR: 16
          EXACT_XCODE_MAJOR: 16
        run: |
          [[ "$(sw_vers -productVersion)" == 14.* ]]
          Scripts/select-xcode.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .build/ui-derived
            .build/xcode-packages
          key: focused-ui-14-${{ hashFiles('Sources/**', 'App/**', 'Package.swift') }}
          restore-keys: focused-ui-14-
      - name: Build mock application and audit driver
        run: |
          set -o pipefail
          just xcode
          xcodebuild -project App/TokenMenuBar.xcodeproj -scheme TokenMenuBar-Direct -configuration Verification \
            -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath .build/ui-derived \
            -clonedSourcePackagesDirPath .build/xcode-packages -jobs 2 ONLY_ACTIVE_ARCH=YES build-for-testing \
            2>&1 | tee .build/ui-build.log | tail -30
      - name: Reproduce three failing cases
        id: audit
        run: |
          set -o pipefail
          Scripts/with-test-desktop.sh xcodebuild -project App/TokenMenuBar.xcodeproj -scheme TokenMenuBar-Direct -configuration Verification \
            -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath .build/ui-derived \
            -clonedSourcePackagesDirPath .build/xcode-packages -resultBundlePath .build/focused-ui.xcresult \
            -only-testing:TokenMenuBarApplicationUITests/TabSwitchBenchmarkUITests/testTabSwitchLatencyAndFrameStability \
            -only-testing:TokenMenuBarApplicationUITests/LiveControlAuditUITests/testHistoryDatesAndControlsRespond \
            -only-testing:TokenMenuBarApplicationUITests/LiveControlAuditUITests/testLongTextAtNarrowWidthInLightAppearance \
            ONLY_ACTIVE_ARCH=YES test-without-building \
            2>&1 | tee .build/focused-ui.log | awk '/Test Case|Test Suite|error:|warning:|TAB_SWITCH|LONG_TEXT/ { print; fflush() }'
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: focused-ui-macos-14
          path: |
            .build/focused-ui.xcresult
            .build/focused-ui.log
            .build/ui-build.log
          include-hidden-files: true
          retention-days: 7

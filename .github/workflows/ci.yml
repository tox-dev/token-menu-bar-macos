name: Focused UI verification

on:
  workflow_dispatch:
    inputs:
      controls:
        description: Control groups to run after the build
        type: choice
        options: [data-log, none, readers]
        default: data-log

permissions:
  contents: read

concurrency:
  group: focused-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: inputs.controls != 'readers'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.9.3
      - name: Select Xcode 16
        id: xcode
        env:
          MIN_XCODE_MAJOR: 16
          EXACT_XCODE_MAJOR: 16
        run: |
          [[ "$(sw_vers -productVersion)" == 14.* ]]
          Scripts/select-xcode.sh
          echo "cache=$(xcodebuild -version | shasum -a 256 | cut -c 1-12)" >> "$GITHUB_OUTPUT"
      - name: Generate project before restoring input timestamps
        run: just xcode
      - name: Restore content-verified build inputs
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1.9.2
        with:
          deriveddata-directory: .build/ui-derived
          sourcepackages-directory: .build/xcode-packages
          key: focused-mtime-v1-14-${{ steps.xcode.outputs.cache }}-${{ hashFiles('Package.swift', 'App/project.yml') }}-${{
            github.sha }}
          restore-keys: focused-mtime-v1-14-${{ steps.xcode.outputs.cache }}-${{ hashFiles('Package.swift', 'App/project.yml')
            }}-
          swiftpm-cache-key: focused-packages-14-${{ steps.xcode.outputs.cache }}-${{ hashFiles('Package.swift', 'App/project.yml')
            }}
          use-default-mtime-targets: false
          restore-mtime-targets: |
            Package.swift
            Sources/**/*
            App/**/*
            Tests/TokenMenuBarNativeGuard/**/*
            Tests/TokenMenuBarTestSupport/**/*
      - name: Build mock application and audit driver
        run: |
          set -o pipefail
          mkdir -p .build
          started=$SECONDS
          xcodebuild -project App/TokenMenuBar.xcodeproj -scheme TokenMenuBar-Direct -configuration Verification \
            -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath .build/ui-derived \
            -clonedSourcePackagesDirPath .build/xcode-packages -jobs 2 ONLY_ACTIVE_ARCH=YES build-for-testing \
            -showBuildTimingSummary 2>&1 | tee .build/ui-build.log | tail -50
          echo "Build execution: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"
          awk '/^SwiftCompile|^SwiftDriver Compilation|^CompileC|^CompileAssetCatalog/ { print substr($0, 1, 180) }' \
            .build/ui-build.log >> "$GITHUB_STEP_SUMMARY"
      - name: Package test products
        run: ditto -c -k .build/ui-derived/Build/Products .build/ui-products.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: focused-ui-products
          path: .build/ui-products.zip
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: focused-ui-build
          path: .build/ui-build.log
          retention-days: 1

  readers:
    if: inputs.controls == 'readers'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.9.3
      - name: Select Xcode 26
        env:
          MIN_XCODE_MAJOR: 26
          EXACT_XCODE_MAJOR: 26
        run: |
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          Scripts/select-xcode.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build
          key: ocr-tesseract-26-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: ocr-tesseract-26-
      - name: Verify bounded background reader work
        run: |
          set -o pipefail
          mkdir -p .build
          just test 'transcriptReaderFinishesAColdTreeOutsideTheProviderPoll|rolloutReaderBoundsTreeEnumerationSlices' \
            2>&1 | tee .build/reader-tests.log | tail -35
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reader-tests-macos-26
          path: .build/reader-tests.log
          retention-days: 1

  ui:
    if: inputs.controls == 'data-log'
    needs: build
    runs-on: macos-14
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: history
            selector: LiveControlAuditUITests/testHistoryDatesAndControlsRespond
          - name: data
            selector: LiveControlAuditUITests/testSettingsDataControlsRespond
          - name: log
            selector: LiveControlAuditUITests/testSettingsLogControlsRespond
          - name: performance
            selector: TabSwitchBenchmarkUITests
          - name: file-choosers
            selector: LiveControlAuditUITests/testFileChoosersReturnToThePopover
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode 16
        env:
          MIN_XCODE_MAJOR: 16
          EXACT_XCODE_MAJOR: 16
        run: |
          [[ "$(sw_vers -productVersion)" == 14.* ]]
          Scripts/select-xcode.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: focused-ui-products
          path: .build
      - name: Run unchanged acceptance assertions
        timeout-minutes: 8
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          set -o pipefail
          ditto -x -k .build/ui-products.zip .build/ui-derived/Build/Products
          specifications=(.build/ui-derived/Build/Products/*.xctestrun)
          [[ "${#specifications[@]}" == 1 ]]
          Scripts/profile-ui-tests.sh Scripts/with-ui-artifacts.sh xcodebuild \
            -xctestrun "${specifications[0]}" -destination "platform=macOS,arch=$(uname -m)" \
            -resultBundlePath .build/focused-ui.xcresult \
            "-only-testing:TokenMenuBarApplicationUITests/$SELECTOR" test-without-building \
            2>&1 | tee .build/focused-ui.log | awk '/Test Case|Test Suite|error:|warning:|TAB_SWITCH|FIRST_SETTINGS|CONTROL_AUDIT/ { print; fflush() }'
      - name: Verify and export test evidence
        id: evidence
        if: always()
        run: |
          if [[ -d .build/focused-ui.xcresult ]]; then
            Scripts/test-ui-results.sh .build/focused-ui.xcresult
            Scripts/export-ui-results.sh .build/focused-ui.xcresult .build/focused-ui-results
          fi
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: focused-ui-${{ matrix.name }}-macos-14
          path: |
            .build/focused-ui-results
            .build/focused-ui.log
            .build/ui-artifacts
          include-hidden-files: true
          retention-days: 1
      - name: Retain an unexportable bundle
        if: ${{ always() && steps.evidence.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: focused-ui-raw-${{ matrix.name }}-macos-14
          path: .build/focused-ui.xcresult
          retention-days: 1

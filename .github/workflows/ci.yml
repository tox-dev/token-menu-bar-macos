name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer && swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
      - name: Lint
        run: swift-format lint --recursive --strict Sources Tests Package.swift
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Tests with coverage gate
        run: Scripts/coverage.sh

  app:
    name: Build app flavors
    runs-on: macos-26
    strategy:
      matrix:
        scheme: [TokenMenuBar-Direct, TokenMenuBar-AppStore]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project App/TokenMenuBar.xcodeproj -scheme ${{ matrix.scheme }} -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build | tail -30

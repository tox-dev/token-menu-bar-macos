name: Settings OCR diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recognize:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Verify macOS 27 runtime
        id: runtime
        run: |
          version="$(sw_vers -productVersion)"
          [[ "${version%%.*}" == 27 ]] || { echo "::error::Unexpected macOS $version"; exit 1; }
          echo "Runtime: macOS $version" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode 27
        env:
          MIN_XCODE_MAJOR: 27
          EXACT_XCODE_MAJOR: 27
        run: Scripts/select-xcode.sh
      - name: Download captured mock Settings
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN_MENU_BAR_RENDER_ARTIFACTS: ${{ runner.temp }}/settings-render
        run: |
          mkdir -p "$TOKEN_MENU_BAR_RENDER_ARTIFACTS"
          gh api repos/tox-dev/token-menu-bar-macos/actions/artifacts/10087044768/zip > "$RUNNER_TEMP/settings.zip"
          unzip -q "$RUNNER_TEMP/settings.zip" -d "$TOKEN_MENU_BAR_RENDER_ARTIFACTS"
      - name: Compare recognition paths on the same PNG
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        env:
          TOKEN_MENU_BAR_RENDER_ARTIFACTS: ${{ runner.temp }}/settings-render
        run: |
          set -o pipefail
          swift - <<'SWIFT' | tee "$TOKEN_MENU_BAR_RENDER_ARTIFACTS/recognition.txt"
          import Foundation
          import Vision

          let directory = URL(fileURLWithPath: ProcessInfo.processInfo.environment["TOKEN_MENU_BAR_RENDER_ARTIFACTS"]!)
          let png = try Data(contentsOf: directory.appendingPathComponent("providers-false.png"))
          var successes = 0
          for cpuOnly in [false, true] {
            do {
              let request = VNRecognizeTextRequest()
              request.revision = VNRecognizeTextRequestRevision3
              request.recognitionLevel = .accurate
              request.recognitionLanguages = ["en-US"]
              request.usesLanguageCorrection = false
              if cpuOnly {
                for (stage, devices) in try request.supportedComputeStageDevices {
                  guard let cpu = devices.first(where: { if case .cpu = $0 { true } else { false } }) else {
                    throw ProbeError.noCPU
                  }
                  request.setComputeDevice(cpu, for: stage)
                }
              }
              try VNImageRequestHandler(data: png, options: [:]).perform([request])
              let text = (request.results ?? []).compactMap { $0.topCandidates(1).first?.string }.joined(separator: " ")
              print("legacy cpuOnly=\(cpuOnly) text=\(text)")
              successes += 1
            } catch {
              print("legacy cpuOnly=\(cpuOnly) error=\(String(reflecting: error))")
            }
          }
          for cpuOnly in [false, true] {
            do {
              var request = RecognizeTextRequest(.revision3)
              request.recognitionLevel = .accurate
              request.recognitionLanguages = [Locale.Language(identifier: "en-US")]
              request.usesLanguageCorrection = false
              if cpuOnly {
                for (stage, devices) in request.supportedComputeStageDevices {
                  guard let cpu = devices.first(where: { if case .cpu = $0 { true } else { false } }) else {
                    throw ProbeError.noCPU
                  }
                  request.setComputeDevice(cpu, for: stage)
                }
              }
              let text = try await request.perform(on: png).compactMap { $0.topCandidates(1).first?.string }.joined(separator: " ")
              print("modern cpuOnly=\(cpuOnly) text=\(text)")
              successes += 1
            } catch {
              print("modern cpuOnly=\(cpuOnly) error=\(String(reflecting: error))")
            }
          }
          guard successes > 0 else { throw ProbeError.noAccurateResults }

          enum ProbeError: Error {
            case noCPU
            case noAccurateResults
          }
          SWIFT
      - name: Retain mock images and recognition results
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: settings-ocr-diagnostic
          path: ${{ runner.temp }}/settings-render
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

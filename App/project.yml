name: TokenMenuBar
options:
  bundleIdPrefix: dev.tox
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  TokenMenuBarPackage:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
targets:
  TokenMenuBar:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/TokenMenuBar
        name: Entry
      - path: Sources
        name: App
    dependencies:
      - package: TokenMenuBarPackage
        product: TokenMenuBarUI
      - package: TokenMenuBarPackage
        product: TokenMenuBarCore
      - package: Sparkle
        product: Sparkle
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleName: Token Menu Bar
        CFBundleDisplayName: Token Menu Bar
        CFBundleIdentifier: dev.tox.token-menu-bar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "MIT License"
        ITSAppUsesNonExemptEncryption: false
        NSSupportsAutomaticTermination: false
        SUFeedURL: https://github.com/tox-dev/token-menu-bar-macos/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_NAME: Token Menu Bar
        PRODUCT_BUNDLE_IDENTIFIER: dev.tox.token-menu-bar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Direct.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DIRECT
        SPARKLE_PUBLIC_ED_KEY: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
        AppStore:
          CODE_SIGN_ENTITLEMENTS: App/AppStore.entitlements
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
          ENABLE_HARDENED_RUNTIME: NO
          ENABLE_APP_SANDBOX: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
    preBuildScripts:
      - name: Strip Sparkle for App Store builds
        script: |
          if [ "$CONFIGURATION" = "AppStore" ]; then
            echo "App Store configuration: Sparkle is compiled out via APPSTORE and must not ship; the release workflow removes the framework after export."
          fi
schemes:
  TokenMenuBar-Direct:
    build:
      targets:
        TokenMenuBar: all
    run:
      config: Debug
    archive:
      config: Release
  TokenMenuBar-AppStore:
    build:
      targets:
        TokenMenuBar: all
    run:
      config: AppStore
    archive:
      config: AppStore

# Read the Docs builds the Hugo site itself: the version comes from mise.toml, so the docs host and a laptop run the
# same Hugo. https://docs.readthedocs.com/platform/stable/build-customization.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - version=$(python3 -c "import pathlib,tomllib;print(tomllib.loads(pathlib.Path('mise.toml').read_text())['tools']['hugo'])")
    - curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_extended_${version}_linux-amd64.tar.gz"
      | tar -xz hugo
    - ./hugo --source website --gc --minify --baseURL "${READTHEDOCS_CANONICAL_URL}" --destination "${READTHEDOCS_OUTPUT}/html"

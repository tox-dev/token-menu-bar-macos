{{- $name := .Get "name" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $scale := int (.Get "scale" | default 2) -}}
<figure class="shot-figure">
  {{- range $variant := (slice "light" "dark") -}}
    {{- with resources.Get (printf "images/%s-%s.png" $name $variant) -}}
      {{/* Full resolution, converted rather than resampled, so the shot stays sharp at any display size */}}
      {{- $webp := .Resize (printf "%dx webp" .Width) -}}
      <img class="shot only-{{ $variant }}" src="{{ $webp.RelPermalink }}" width="{{ div $webp.Width $scale }}"
           height="{{ div $webp.Height $scale }}" alt="{{ $alt }}" loading="lazy" decoding="async">
    {{- end -}}
  {{- end -}}
  {{- with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end -}}
</figure>

{{- /* Keep one h1 per page (the title): demote an in-content h1 to h2 and leave deeper levels alone. */ -}}
{{- $level := .Level -}}
{{- if le .Level 1 }}{{ $level = 2 }}{{ end -}}
<h{{ $level }} id="{{ .Anchor | safeURL }}">
  {{- .Text | safeHTML -}}
  <a class="anchor" href="#{{ .Anchor | safeURL }}" aria-label="Link to this section">#</a>
</h{{ $level }}>

{{ define "main" }}
<article class="page">
  <div class="wrap">
    {{ with .Parent }}
      {{ if not .IsHome }}
        <p class="breadcrumb"><a href="{{ .RelPermalink }}">{{ .Title }}</a></p>
      {{ end }}
    {{ end }}
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Description }}<p class="page-lede">{{ . }}</p>{{ end }}
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}

site_name: Token Menu Bar
site_description: Claude Code and Codex plan usage in your macOS menu bar
site_url: https://tox-dev.github.io/token-menu-bar-macos/
repo_url: https://github.com/tox-dev/token-menu-bar-macos
repo_name: tox-dev/token-menu-bar-macos
edit_uri: edit/main/docs/
copyright: MIT License

theme:
  name: material
  logo: images/icon.svg
  favicon: images/icon.svg
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Install: install.md
  - What you see: features.md
  - Settings: settings.md
  - Privacy and limits: privacy.md
  - Contributing: contributing.md
